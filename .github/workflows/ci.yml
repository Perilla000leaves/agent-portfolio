name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,frameworks]" ruff

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

      - name: Framework demos
        run: |
          python langgraph/chain.py --demo
          python langchain/chain.py --demo
          python adk/chain.py --demo

      - name: Compile check
        run: python -m compileall -q toolcore chaincore
